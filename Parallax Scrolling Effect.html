<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Practice</title>
  <link rel="stylesheet" href="./Parallax Scrolling Effect.css">
</head>

<body>

  <div class="main-container">


    <div class="parallax">
      <div class="overlay">
        Welcome to the Parallax World
      </div>
    </div>


    <div class="linear">
      <span>Linear Gradient Section</span>
    </div>

    <div class="radial">
      <span>Radial Gradient Section</span>
    </div>


    <div class="conic">
      <span>Conic Gradient Section</span>
    </div>


    <div class="highlight">
      <b>This block uses two classes: text-block and highlight.</b>
    </div>


    <div class="parent">
      <h3>Parent Box Heading</h3>
      <p>This paragraph is a child element styled inside the parent.</p>
    </div>

  </div>

</body>

</html>
