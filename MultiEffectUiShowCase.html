<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Effect Ui Show Case</title>
  <link rel="stylesheet" href="./MultiEffectUiShowCase.css">
</head>

<body>
  <div class="text">
    <b>Video Link :</b>
    <a href="#">Link</a>
  </div>

  <div class="card">

    <header class="header">
      <h1>Multi Effect Ui Show Case</h1>
      <p>All Section styled without flexbox</p>
    </header>

    <div class="Layout">

      <div class="Profile-card">

        <h1 class="h1">Layered Profile Cards</h1>

        <div class="images">
          <div class="box">
            <img src="./Portfolio Wireframe(Project)/Assets/Abhi.jpg.jpg" alt="image" class="img">
            <h1 class="h2">Alice</h1>
            <p class="p1">UI/Ux Designer</p>
          </div>
          <div class="box2">
            <img src="./Portfolio Wireframe(Project)/Assets/Abhi.jpg.jpg" alt="image" class="img2">
            <h1 class="h2">Bob</h1>
            <p class="p1">Full Stack Dev</p>
          </div>

        </div>

      </div>

      <div class="quiz">
        <h1 class="h3">Quiz Flashcards</h1>


        <div class="box3">
          <h1 class="h4">What is Html?</h1>
        </div>

        <div class="box4">
          <h1 class="h5">What is Css?</h1>
        </div>

      </div>


      <div class="creative">

        <h1 class="h6">Creative Buttons</h1>

        <div class="button-row">
          <button class="btn">Side Button</button>
          <button class="btn1">Side Button</button>
        </div>

      </div>


      <div class="Images">

        <h1 class="h7">Intractive Image Gallery</h1>

        <div class="row">

          <img src="./bg.jpg" alt="image" class="img3">
          <img src="./Assets/bg2.jpg" alt="image" class="img4">
          <img src="./Assets/bg3.jpg" alt="image" class="img5">

        </div>

      </div>


    </div>



  </div>
</body>

</html>
