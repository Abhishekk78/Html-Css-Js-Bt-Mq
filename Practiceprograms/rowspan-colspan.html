<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Table</title>
</head>
<body>
    <h1>Employee Table</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Designation</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Adarsh</td>
                <td>20</td>
                <td>Faculty</td>
                <td>20000</td>
            </tr>
              <tr>
                <td>2</td>
                <td>Manas</td>
                <td rowspan="2">24</td>
                <td rowspan="2">Data Analyst</td>
                <td>120000</td>
            </tr>
              <tr>
                <td>3</td>
                <td>Yashraj</td>
                <td>50000</td>
            </tr>
        </tbody>

        <tfoot>
            <td colspan="4">Total Salary</td>
            <td>190000</td>
        </tfoot>

    </table>

</body>
</html>
