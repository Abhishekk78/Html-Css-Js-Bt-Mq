<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sign-Up Form</title>
</head>
<body>

    <form>

     <div>
        <label for="Username">User Name : </label>
        <input type="text" name="Username" placeholder="Enter your name">
     </div>    

     <div>
       <label for="Email">Email : </label>
       <input type="email" name="Email" placeholder="Enter you email">
     </div>

     <div>
        <label for="Date">Dob : </label>
        <input type="date" name="Date" placeholder="Enter your date of birth">
     </div>

     <div>
        <label for="Password">Password : </label>
        <input type="password" name="Password" placeholder="Enter your password">
     </div>

     <div>
        <label for="Profile pic">Profile pic : </label>
        <input type="file" name="Profile pic" placeholder="Select your profile picture">
     </div>

     <div>
        <label for="Check">Checkbox : </label>
         <input type="checkbox" name="Check">
     </div>

     <div>
        <label for="Radio">Radio : </label>
        <input type="radio" name="Radio">
     </div>

     <div>
        <label for="select city">Select Ypur City</label>
        <select name="select city" >Select your city: 
            <option value="Select your city">Select your city</option> 
             <option value="Bharuch">Bharuch</option>
             <option value="Suart">Surat</option>
             <option value="Vadodra">Vadodra</option>
             <option value="Rajkot">Rajkot</option>

        </select>
     </div>

     <div>
        <label for="color">Color Picker : </label>
        <input type="color" name="color">
     </div>

     <button>Sign Up</button>


    </form>
    
</body>
</html>
