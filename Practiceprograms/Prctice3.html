<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Banner</title>

    <style>
        h1 {
            text-align: center;
        }

        .alert-box {
            margin-left: 550px;
            height: 80px;
            width: 450px;
            background-color: #fff3cd;
            border: 1px dashed;
            border-color: #ffeeba;
            border-radius: 8px;

        }

        .alert-box p {
            font-size: 16px;
            text-align: center;
            color: #856404;
        }
    </style>

</head>

<body>

    <h1>Alert Box </h1>

    <aside class="alert-box">

        <p>
            ⚠️ A warning message is a communication intended to alert individuals or users about a potential hazard,
            system
            issue, or data loss before an event happens or an action is taken.
        </p>

    </aside>

</body>

</html>
