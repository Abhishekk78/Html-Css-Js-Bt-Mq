<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
        <div>

            <label for="Date Local">Date and time : </label>
            <input type="datetime-local" name="Date Local">
        </div>

        <div>
          <label for="Image"> Put Image:</label>  
           <input type="image" name="Image">
        </div>

        <div>
            <label for="Month">Select Month and year :</label>
            <input type="month" name="Month">
        </div>
        <div>
            <label for="Number">Phone Number : </label>
            <input type="number" name="Numebr" placeholder="Enter your phone number">
        </div>
        <div>
            <label for="Range">Select your price range between (1 to 10) : </label>
            <input type="range" name="Range">
        </div>

        <div>
            <label for="Search">Serch anything : </label>
            <input type="search" name="Search" placeholder="Search here....">
        </div>

        <div>
            <label for="Time">Select your time : </label>
            <input type="time" name="Time">
        </div>

        <div>
            <label for="Url">Enter your url :</label>
          <input type="url" name="Url" placeholder="Enter your url">
        </div>

         <div>
            <label for="Week">Select your week : </label>
            <input type="week" name="week">
         </div>

           <div>
            <label for="Reset">Rest Button :</label>
            <input type="reset" name="rest">
        </div>
    </form>
</body>
</html>
