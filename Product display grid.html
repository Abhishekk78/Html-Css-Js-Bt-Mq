<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product display grid</title>
    <link rel="stylesheet" href="./Product display grid.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="https://cloudflare.com">
</head>

<body>
    <h1 class="h1">Product display grid</h1>

    <div class="product">

        <div class="container">

            <i class="fa-solid fa-vial custom-vial-icon "></i>
            <p class="text">Layout Lab : Product Display Toggle Grid</p>
        </div>

        <div class="card">

            <div class="box1">

                <img src="./smartwatch (1).png" alt="" class="img1">

                <p class="p1">Smart Watch</p>

                <p class="p2">$99.99</p>

            </div>

            <div class="box2">

                <img src="./music.png" alt="" class="img2">

                <p class="p3">Wireless Headphones</p>

                <p class="p4">$79.00</p>

            </div>

            <div class="box3">
                <img src="./smartwatch.png" alt="" class="img3">

                <p class="p5">Fitness Band</p>

                <p class="p6">$49.99</p>
            </div>

        </div>

    </div>


</body>

</html>
